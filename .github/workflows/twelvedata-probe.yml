name: TradingLab - Twelve Data coverage probe

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tradinglab-twelvedata-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check provider coverage without exposing credentials
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python src/twelvedata_probe.py
      - name: Commit sanitized coverage report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/providers/twelvedata_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: atualizar diagnóstico Twelve Data"
          git push
