name: TradingLab - MEXC crypto snapshot

on:
  workflow_dispatch:
  schedule:
    # UTC: 06:50, 12:50 e 18:50 em America/Sao_Paulo (UTC-3)
    - cron: '50 9,15,21 * * *'

permissions:
  contents: write

concurrency:
  group: tradinglab-mexc-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public closed candles
        run: python src/mexc_public.py --output data/crypto/latest.json
      - name: Analyze closed candles
        run: python src/crypto_analysis.py --input data/crypto/latest.json --output reports/crypto/latest.json
      - name: Archive technical analysis
        run: python src/archive_analysis.py --report reports/crypto/latest.json --history-dir data/history
      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crypto/latest.json reports/crypto/latest.json data/history/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "data: atualizar snapshot MEXC"
          git push
