name: TradingLab - Forex and gold snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '40 9,15,21 * * 1-5'

permissions:
  contents: write

concurrency:
  group: tradinglab-forex-gold
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect UTC closed candles
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python src/twelvedata_collect.py
      - name: Analyze FX and gold
        run: python src/multimarket_analysis.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/multimarket/latest.json reports/multimarket/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: atualizar forex e ouro"
          git pull --rebase
          git push
